<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odeme | QUAORA</title>
  <link rel="stylesheet" href="quaora-tailwind.css">
    <script src="https://cdn.tailwindcss.com" defer></script>
    <link rel="stylesheet" href="quaora-responsive.css">
<link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="//firestore.googleapis.com">
<link rel="dns-prefetch" href="//www.paytr.com">
<script src="quaora-performance.js" defer></script>
</head>
<body class="min-h-screen bg-[#FAE29C] text-[#964b00] p-4 md:p-8">
  <main class="quaora-fade-up max-w-3xl mx-auto bg-white rounded-2xl shadow-xl p-6 md:p-8">
    <a href="index.html" class="text-xs font-black tracking-widest uppercase">&larr; QUAORA</a>
    <h1 class="text-3xl md:text-4xl font-black mt-4 mb-6">Odeme</h1>
    <section id="checkoutContent" class="space-y-4"></section>
    <section id="paytrFrameWrap" class="hidden mt-8">
      <div class="mb-3 rounded-xl bg-[#FAE29C]/50 border border-[#964b00]/15 p-3 text-xs font-bold text-gray-600">
        Odeme formu PayTR guvenli altyapisi ile aciliyor.
      </div>
      <script src="https://www.paytr.com/js/iframeResizer.min.js"></script>
      <iframe id="paytriframe" frameborder="0" scrolling="no" style="width: 100%; min-height: 640px;"></iframe>
    </section>
    <div id="checkoutPolicyLinks" class="mt-8 pt-5 border-t border-[#964b00]/10 flex flex-wrap gap-4 text-[10px] font-black uppercase tracking-[0.22em]">
      <a href="iade-politikasi.html" class="hover:text-black transition-colors">İade Politikası</a>
      <a href="gizlilik-sozlesmesi.html" class="hover:text-black transition-colors">Gizlilik Sözleşmesi</a>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyChIV6BI3U6aPxUsRm0akBCPLLBAg6XM9U",
      authDomain: "quaora-web.firebaseapp.com",
      projectId: "quaora-web",
      storageBucket: "quaora-web.firebasestorage.app",
      messagingSenderId: "69244174750",
      appId: "1:69244174750:web:5c9e82172704bb39a2568f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const content = document.getElementById('checkoutContent');
    const frameWrap = document.getElementById('paytrFrameWrap');
    const paytrFrame = document.getElementById('paytriframe');
    let isPaytrStarting = false;

    let cart = [];
    try { cart = JSON.parse(localStorage.getItem('quaora_cart') || '[]'); } catch (e) { cart = []; }
    cart = Array.isArray(cart) ? cart.filter(item => Number(item.price || 0) > 0) : [];
    if (cart.length > 1) {
      cart = [cart[cart.length - 1]];
      localStorage.setItem('quaora_cart', JSON.stringify(cart));
    }

    const money = (value) => '₺' + Number(value || 0).toLocaleString('tr-TR');
    const subtotal = () => cart.reduce((sum, item) => sum + (Number(item.price || 0) * Number(item.qty || 1)), 0);

    const normalizeCode = (code) => String(code || '').trim().toLocaleUpperCase('tr-TR').replace(/\s+/g, '').replace(/[^A-ZÇĞİÖŞÜ0-9_-]/g, '');

    const readAppliedPromo = () => {
      try { return JSON.parse(localStorage.getItem('quaora_promo') || 'null'); } catch (e) { return null; }
    };

    const getDiscount = async (user) => {
      const promo = readAppliedPromo();
      const code = normalizeCode(promo?.code || promo?.promoCode || '');
      if (!code) return { discount: 0, promo: null };

      const snap = await getDoc(doc(db, "discount_codes", code));
      if (!snap.exists()) return { discount: 0, promo: null, message: "Kod bulunamadi." };

      const data = snap.data();
      const sub = subtotal();
      const usedBy = data.usedBy || {};
      const isOwnerCode = data.ownerUid && (!user || data.ownerUid !== user.uid);
      const alreadyUsed = user && usedBy[user.uid];
      const inactive = data.active === false;
      const maxed = Number(data.maxUses || 0) > 0 && Number(data.usedCount || 0) >= Number(data.maxUses || 0);
      const belowMin = sub < Number(data.minSubtotal || 0);

      if (inactive || isOwnerCode || alreadyUsed || maxed || belowMin) {
        return { discount: 0, promo: null, message: "Kod bu siparis icin kullanilamaz." };
      }

      let discount = 0;
      if (data.type === "percent") discount = Math.round(sub * Number(data.value || 0) / 100);
      if (data.type === "fixed") discount = Math.min(Number(data.value || 0), sub);
      return { discount: Math.max(0, discount), promo: { code, ...data } };
    };

    const renderSummary = (discount, promo, message) => {
      const sub = subtotal();
      const total = Math.max(0, sub - discount);
      content.innerHTML = `
        <div class="space-y-3">
          ${cart.map(item => `
            <div class="rounded-xl border border-[#964b00]/20 bg-[#FAE29C]/30 p-4">
              <div class="flex justify-between gap-4">
                <div>
                  <h2 class="font-black uppercase text-sm tracking-widest">${item.name || 'Urun'}</h2>
                  <p class="text-xs font-bold text-gray-500 mt-1">${item.size ? `Beden: ${item.size}` : 'Tek urun'} | Adet: ${item.qty || 1}</p>
                </div>
                <p class="font-black">${money(Number(item.price || 0) * Number(item.qty || 1))}</p>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="rounded-xl border border-[#964b00]/20 p-4 space-y-2">
          <div class="flex justify-between text-sm font-bold text-gray-600"><span>Ara toplam</span><span>${money(sub)}</span></div>
          ${discount > 0 ? `<div class="flex justify-between text-sm font-black text-green-700"><span>Indirim (${promo.code})</span><span>-${money(discount)}</span></div>` : ''}
          ${message ? `<div class="text-xs font-bold text-red-600">${message}</div>` : ''}
          <div class="flex justify-between border-t pt-3 text-xl font-black"><span>Toplam</span><span>${money(total)}</span></div>
        </div>
        <div id="checkoutStatus" class="hidden rounded-xl p-3 text-sm font-bold"></div>
        <button id="startPaytrBtn" type="button" class="w-full bg-[#964b00] text-white py-4 rounded-xl font-black tracking-widest hover:bg-black transition-all uppercase text-sm disabled:opacity-60 disabled:cursor-not-allowed">PayTR ile ode</button>
      `;
      document.getElementById('startPaytrBtn')?.addEventListener('click', () => startPaytr(discount, promo));
    };

    const setCheckoutStatus = (message, type = "info") => {
      const status = document.getElementById('checkoutStatus');
      if (!status) return;
      status.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'bg-[#FAE29C]/50', 'text-[#964b00]');
      status.classList.add(type === "error" ? 'bg-red-50' : 'bg-[#FAE29C]/50', type === "error" ? 'text-red-700' : 'text-[#964b00]');
      status.innerText = message;
    };

    const setPaytrButtonLoading = (loading) => {
      const button = document.getElementById('startPaytrBtn');
      if (!button) return;
      button.disabled = loading;
      button.innerText = loading ? 'PayTR aciliyor...' : 'PayTR ile ode';
    };

    const renderEmpty = () => {
      content.innerHTML = `
        <div class="p-4 rounded-xl bg-red-50 text-red-600 font-bold">Sepet bos. Odeme baslatmak icin once urun ekleyin.</div>
        <a href="index.html" class="inline-flex items-center justify-center bg-[#964b00] text-white rounded-xl px-5 py-3 font-black uppercase text-xs tracking-widest">Alisverise Don</a>
      `;
    };

    const markPromoUsed = async (promo, user) => {
      if (!promo?.code || !user) return;
      await updateDoc(doc(db, "discount_codes", promo.code), {
        [`usedBy.${user.uid}`]: true,
        usedCount: increment(1),
        updatedAt: Date.now()
      }).catch(() => {});
    };

    const getPaytrEndpoint = () => {
      if (location.protocol === "http:" || location.protocol === "https:") {
        if (location.hostname === "quaora.com.tr" || location.hostname === "www.quaora.com.tr") {
          return "https://www.quaora.com.tr/api/paytr-create-token";
        }
        return `${location.origin}/api/paytr-create-token`;
      }
      return "api/paytr-create-token";
    };

    const requestPaytrToken = async (payload) => {
      const endpoint = getPaytrEndpoint();
      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const rawResponse = await response.text();
      let data = null;
      try {
        data = JSON.parse(rawResponse);
      } catch (parseError) {
        const preview = rawResponse ? rawResponse.slice(0, 120) : "bos cevap";
        throw new Error("PayTR backend JSON donmedi: " + preview);
      }

      if (!response.ok || data.status !== "success") {
        throw new Error(data.reason || "PayTR odeme formu acilamadi.");
      }
      return data;
    };

    const startPaytr = async (discount, promo) => {
      if (isPaytrStarting) return;
      isPaytrStarting = true;
      setPaytrButtonLoading(true);
      setCheckoutStatus('Siparis olusturuluyor, lutfen bekle...');

      let orderRef = null;
      try {
        const user = auth.currentUser;
        if (!user) {
          setCheckoutStatus('Odeme icin once giris yapmalisin.', 'error');
          return;
        }

        const sub = subtotal();
        const total = Math.max(0, sub - discount);
        if (total <= 0) {
          setCheckoutStatus('Odeme tutari gecersiz.', 'error');
          return;
        }

        orderRef = await addDoc(collection(db, "orders"), {
          userId: user.uid,
          userEmail: user.email,
          items: cart.map(item => ({
            productId: item.id || "",
            collectionName: item.collectionName || "",
            productName: item.name || "Urun",
            image: item.image || item.imageUrl || (Array.isArray(item.images) ? item.images[0] : "") || "",
            size: item.size || "",
            qty: Number(item.qty || 1),
            price: Number(item.price || 0)
          })),
          subtotal: sub,
          discount,
          promoCode: promo?.code || "",
          total,
          status: "PayTR odeme baslatildi",
          createdAt: Date.now()
        });

        const profileSnap = await getDoc(doc(db, "users", user.uid)).catch(() => null);
        const profile = profileSnap?.exists() ? profileSnap.data() : {};
        const basket = cart.map(item => ({
          name: item.name || "Quaora urun",
          price: Number(item.price || 0),
          qty: Number(item.qty || 1)
        }));

        setCheckoutStatus('PayTR guvenli odeme formu hazirlaniyor...');
        const data = await requestPaytrToken({
          merchant_oid: orderRef.id,
          email: user.email,
          user_name: profile.username || user.email || "Quaora Musterisi",
          user_phone: profile.phone || "0000000000",
          user_address: profile.address || "Quaora online siparis",
          payment_amount: Math.round(total * 100),
          basket
        });

        await markPromoUsed(promo, user);
        await updateDoc(orderRef, { paytrTokenCreated: true, updatedAt: Date.now() }).catch(() => {});
        localStorage.removeItem('quaora_cart');
        localStorage.removeItem('quaora_promo');
        paytrFrame.src = `https://www.paytr.com/odeme/guvenli/${data.token}`;
        frameWrap.classList.remove('hidden');
        setCheckoutStatus('PayTR formu acildi. Odemenizi asagidan tamamlayabilirsiniz.');
        window.iFrameResize?.({}, '#paytriframe');
        frameWrap.scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (error) {
        console.error(error);
        if (orderRef) await updateDoc(orderRef, { status: "PayTR baslatma hatasi", paytrError: error.message || String(error), updatedAt: Date.now() }).catch(() => {});
        setCheckoutStatus(error.message || "PayTR odeme formu acilamadi.", 'error');
      } finally {
        isPaytrStarting = false;
        setPaytrButtonLoading(false);
      }
    };

    onAuthStateChanged(auth, async (user) => {
      if (cart.length === 0) return renderEmpty();
      const result = await getDiscount(user).catch(() => ({ discount: 0, promo: null, message: "Indirim kontrol edilemedi." }));
      renderSummary(result.discount, result.promo, result.message);
    });
  </script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }, { once: true });
}
</script>
</body>
</html>
