<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odeme Tamamlanamadi | QUAORA</title>
  <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="quaora-responsive.css">
</head>
<body class="min-h-screen bg-[#FAE29C] text-[#964b00] flex items-center justify-center p-6">
  <main class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center">
    <h1 class="text-3xl font-black mb-3">Odeme tamamlanamadi</h1>
    <p class="text-sm font-bold text-gray-600 mb-6">Tekrar denemek icin sepetinize donebilirsiniz.</p>
    <a href="checkout.html" class="inline-flex bg-[#964b00] text-white px-5 py-3 rounded-xl font-black tracking-widest uppercase text-xs">Tekrar dene</a>
  </main>
<script id="quaora-performance-helpers">
(() => {
  const tuneImage = (img) => {
    if (!img || img.dataset.quaoraPerfReady) return;
    img.dataset.quaoraPerfReady = "1";
    if (!img.hasAttribute("loading")) img.setAttribute("loading", "lazy");
    if (!img.hasAttribute("decoding")) img.setAttribute("decoding", "async");
  };

  const tuneAllImages = () => document.querySelectorAll("img").forEach(tuneImage);

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", tuneAllImages, { once: true });
  } else {
    tuneAllImages();
  }

  const observer = new MutationObserver((mutations) => {
    for (const mutation of mutations) {
      for (const node of mutation.addedNodes) {
        if (node.nodeType !== 1) continue;
        if (node.tagName === "IMG") tuneImage(node);
        node.querySelectorAll?.("img").forEach(tuneImage);
      }
    }
  });

  observer.observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
</body>
</html>
