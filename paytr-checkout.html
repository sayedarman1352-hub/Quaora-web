<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odeme | QUAORA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#FAE29C] text-[#964b00] p-4 md:p-8">
  <main class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl p-6 md:p-8">
    <a href="index.html" class="text-xs font-black tracking-widest uppercase">&larr; QUAORA</a>
    <h1 class="text-3xl md:text-4xl font-black mt-4 mb-6">Odeme</h1>

    <section id="cartSummary" class="space-y-3 mb-8"></section>

    <form method="post" action="/api/create-payment" class="space-y-4">
      <input type="hidden" name="cart_json" id="cartJson">
      <div>
        <label class="block text-xs font-black uppercase mb-1">Ad Soyad</label>
        <input name="user_name" required class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-[#964b00]/30">
      </div>
      <div>
        <label class="block text-xs font-black uppercase mb-1">E-posta</label>
        <input name="email" type="email" required class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-[#964b00]/30">
      </div>
      <div>
        <label class="block text-xs font-black uppercase mb-1">Telefon</label>
        <input name="user_phone" required class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-[#964b00]/30">
      </div>
      <div>
        <label class="block text-xs font-black uppercase mb-1">Adres</label>
        <textarea name="user_address" required rows="3" class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-[#964b00]/30"></textarea>
      </div>
      <button id="payButton" class="w-full bg-[#964b00] text-white rounded-xl py-4 font-black tracking-widest uppercase">PayTR ile Ode</button>
    </form>
  </main>

  <script>
    const cart = JSON.parse(localStorage.getItem('quaora_cart') || '[]');
    const summary = document.getElementById('cartSummary');
    const cartJson = document.getElementById('cartJson');
    const payButton = document.getElementById('payButton');

    if (!cart.length) {
      summary.innerHTML = '<div class="p-4 rounded-xl bg-red-50 text-red-600 font-bold">Sepet bos. Odeme baslatmak icin once urun ekleyin.</div>';
      payButton.disabled = true;
      payButton.classList.add('opacity-50', 'cursor-not-allowed');
    } else {
      let total = 0;
      summary.innerHTML = cart.map(item => {
        const qty = item.qty || 1;
        const line = Number(item.price || 0) * qty;
        total += line;
        return `<div class="flex justify-between gap-4 border-b pb-3 text-sm">
          <div><strong>${item.name || 'Urun'}</strong><div class="text-gray-500">Beden: ${item.size || '-' } | Adet: ${qty}</div></div>
          <div class="font-black">${line.toLocaleString('tr-TR')} TL</div>
        </div>`;
      }).join('') + `<div class="flex justify-between text-xl font-black pt-2"><span>Toplam</span><span>${total.toLocaleString('tr-TR')} TL</span></div>`;
      cartJson.value = JSON.stringify(cart);
    }
  </script>
</body>
</html>
