<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sipariş Detayı | QUAORA</title>
  <link rel="stylesheet" href="quaora-tailwind.css">
  <script src="https://cdn.tailwindcss.com" defer></script>
  <link rel="stylesheet" href="quaora-responsive.css">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="//firestore.googleapis.com">
  <script src="quaora-performance.js" defer></script>
</head>
<body class="min-h-screen bg-white text-[#2f2418]">
  <main class="mx-auto max-w-5xl p-4 md:p-8">
    <header class="flex flex-col gap-4 border-b border-[#e5e0d8] pb-6 md:flex-row md:items-end md:justify-between">
      <div>
        <a href="siparisler.html" class="text-xs font-black uppercase tracking-[0.24em] text-[#7a4a22] transition-colors hover:text-[#2f2418]">&larr; Siparişler</a>
        <h1 class="mt-4 text-3xl font-black uppercase tracking-[0.08em] md:text-5xl">Sipariş Detayı</h1>
        <p id="detailStatus" class="mt-2 text-sm font-bold text-[#7b6b5a]">Sipariş yükleniyor.</p>
      </div>
      <div id="preparedBadge" class="hidden rounded-full border px-4 py-2 text-xs font-black uppercase tracking-widest"></div>
    </header>

    <section id="lockedState" class="mt-8 hidden rounded-lg border border-[#e5e0d8] bg-white p-6 shadow-sm">
      <h2 class="text-xl font-black uppercase tracking-widest">Admin girişi gerekiyor</h2>
      <p class="mt-2 text-sm font-bold text-gray-500">Bu sayfa sadece quaoratr@gmail.com hesabı tarafından görüntülenebilir.</p>
      <a href="index.html" class="mt-5 inline-flex rounded-lg bg-[#7a4a22] px-5 py-3 text-xs font-black uppercase tracking-widest text-white">Ana Sayfaya Dön</a>
    </section>

    <section id="detailApp" class="mt-8 hidden space-y-5">
      <div id="orderSummary" class="space-y-5"></div>
      <div class="flex flex-col gap-3 rounded-lg border border-[#e5e0d8] bg-white p-4 shadow-sm sm:flex-row sm:items-center sm:justify-between">
        <div>
          <h2 class="text-sm font-black uppercase tracking-widest text-[#2f2418]">Admin kontrol</h2>
          <p id="adminPreparedText" class="mt-1 text-xs font-bold text-gray-500">Sipariş bilgileri henüz alınmadı.</p>
        </div>
        <button id="preparedBtn" type="button" class="rounded-lg bg-[#7a4a22] px-5 py-3 text-xs font-black uppercase tracking-widest text-white transition-colors hover:bg-[#2f2418]">Bilgileri aldım</button>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyChIV6BI3U6aPxUsRm0akBCPLLBAg6XM9U",
      authDomain: "quaora-web.firebaseapp.com",
      projectId: "quaora-web",
      storageBucket: "quaora-web.firebasestorage.app",
      messagingSenderId: "69244174750",
      appId: "1:69244174750:web:5c9e82172704bb39a2568f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const el = (id) => document.getElementById(id);
    const orderId = new URLSearchParams(window.location.search).get("id");
    let activeAdminEmail = "";
    let currentOrder = null;

    const money = (value) => `₺${Number(value || 0).toLocaleString("tr-TR")}`;
    const escapeHtml = (value) => String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    const getOrderItems = (order) => {
      if (Array.isArray(order.items) && order.items.length) return order.items;
      return [{
        productName: order.productName || order.name || "Ürün",
        size: order.size || "",
        qty: order.qty || 1,
        price: order.price || order.total || 0
      }];
    };

    const getCustomer = (order) => {
      const customer = order.customer || {};
      return {
        name: customer.name || order.userName || order.name || "İsimsiz müşteri",
        email: customer.email || order.userEmail || "",
        phone: customer.phone || order.userPhone || order.phone || "Yok",
        address: customer.address || order.shippingAddress || order.address || "Yok",
        city: customer.city || order.shippingCity || "",
        district: customer.district || order.shippingDistrict || ""
      };
    };

    const getOrderTime = (order) => Number(order.paidAt || order.stockProcessedAt || order.createdAt || 0);
    const infoRow = (label, value) => `
      <div class="rounded-lg border border-[#e5e0d8] bg-white p-3 shadow-sm">
        <p class="text-[10px] font-black uppercase tracking-[0.22em] text-[#7b6b5a]">${label}</p>
        <p class="mt-1 break-words text-sm font-bold text-[#2f2418]">${escapeHtml(value || "Yok")}</p>
      </div>
    `;

    const updatePreparedUi = () => {
      const prepared = currentOrder?.adminPrepared === true;
      const badge = el("preparedBadge");
      badge.classList.remove("hidden", "border-[#079455]", "bg-[#d1fadf]", "text-[#064e3b]", "border-amber-300", "bg-amber-50", "text-amber-800");
      badge.classList.add(...(prepared
        ? ["border-[#079455]", "bg-[#d1fadf]", "text-[#064e3b]"]
        : ["border-amber-300", "bg-amber-50", "text-amber-800"]));
      badge.textContent = prepared ? "Bilgiler alındı" : "Bekliyor";
      el("adminPreparedText").textContent = prepared
        ? `Bu sipariş ${currentOrder.adminPreparedBy || "admin"} tarafından işaretlendi.`
        : "Sipariş bilgileri henüz alınmadı.";
      el("preparedBtn").textContent = prepared ? "Tekrar bekleyen yap" : "Bilgileri aldım";
      el("preparedBtn").className = prepared
        ? "rounded-lg bg-[#9f3a32] px-5 py-3 text-xs font-black uppercase tracking-widest text-white transition-colors hover:bg-[#2f2418]"
        : "rounded-lg bg-[#7a4a22] px-5 py-3 text-xs font-black uppercase tracking-widest text-white transition-colors hover:bg-[#2f2418]";
    };

    const renderOrder = () => {
      const order = currentOrder;
      const customer = getCustomer(order);
      const items = getOrderItems(order);
      const subtotal = Number(order.subtotal || items.reduce((sum, item) => sum + Number(item.price || 0) * Number(item.qty || 1), 0));
      const discount = Number(order.discount || 0);
      const total = Number(order.total || Math.max(0, subtotal - discount));
      const time = getOrderTime(order);

      el("detailStatus").textContent = `${customer.name} siparişi`;
      el("orderSummary").innerHTML = `
        <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
          ${infoRow("Ad Soyad", customer.name)}
          ${infoRow("Telefon", customer.phone)}
          ${infoRow("E-posta", customer.email)}
          ${infoRow("Sipariş Tarihi", time ? new Date(time).toLocaleString("tr-TR") : "")}
          ${infoRow("Adres", customer.address)}
          ${infoRow("İl / İlçe", [customer.city, customer.district].filter(Boolean).join(" / "))}
        </div>

        <div class="rounded-lg border border-[#e5e0d8] bg-white p-4 shadow-sm">
          <h2 class="text-sm font-black uppercase tracking-widest text-[#2f2418]">Ürünler</h2>
          <div class="mt-3 space-y-2">
            ${items.map((item) => `
              <div class="grid grid-cols-1 gap-2 rounded-lg border border-[#e5e0d8] bg-[#f8fafc] p-3 md:grid-cols-[2fr_1fr_0.7fr_1fr] md:items-center">
                <span class="text-sm font-black uppercase tracking-[0.08em] text-[#2f2418]">${escapeHtml(item.productName || item.name || "Ürün")}</span>
                <span class="text-xs font-bold text-gray-600">Beden: ${escapeHtml(item.size || item.selectedSize || "Tek ürün")}</span>
                <span class="text-xs font-bold text-gray-600">Adet: ${Number(item.qty || 1)}</span>
                <span class="text-sm font-black text-[#7a4a22]">${money(Number(item.price || 0) * Number(item.qty || 1))}</span>
              </div>
            `).join("")}
          </div>
        </div>

        <div class="grid grid-cols-1 gap-3 md:grid-cols-3">
          ${infoRow("Ara Toplam", money(subtotal))}
          ${infoRow("İndirim", discount > 0 ? money(discount) : "Yok")}
          ${infoRow("Toplam", money(total))}
        </div>

        <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
          ${infoRow("Sipariş ID", order.id)}
          ${infoRow("Durum", order.status || order.paymentStatus || "Alındı")}
          ${infoRow("Promosyon", order.promoCode || "Yok")}
          ${infoRow("PayTR Hata", order.paytrFailReasonMsg || order.paytrFailReasonCode || "Yok")}
        </div>
      `;
      updatePreparedUi();
    };

    const setPrepared = async () => {
      if (!currentOrder) return;
      const nextValue = currentOrder.adminPrepared !== true;
      const previous = { ...currentOrder };
      const timestamp = Date.now();
      currentOrder.adminPrepared = nextValue;
      currentOrder.adminPreparedAt = nextValue ? timestamp : null;
      currentOrder.adminPreparedBy = nextValue ? activeAdminEmail : "";
      updatePreparedUi();

      try {
        await updateDoc(doc(db, "orders", orderId), {
          adminPrepared: nextValue,
          adminPreparedAt: nextValue ? timestamp : null,
          adminPreparedBy: nextValue ? activeAdminEmail : "",
          updatedAt: Date.now()
        });
      } catch (error) {
        console.error(error);
        currentOrder = previous;
        updatePreparedUi();
        alert("Sipariş işareti kaydedilemedi.");
      }
    };

    const loadOrder = async () => {
      if (!orderId) {
        el("detailStatus").textContent = "Sipariş ID bulunamadı.";
        return;
      }

      const snap = await getDoc(doc(db, "orders", orderId));
      if (!snap.exists()) {
        el("detailStatus").textContent = "Sipariş bulunamadı.";
        return;
      }

      currentOrder = { id: snap.id, ...snap.data() };
      renderOrder();
    };

    el("preparedBtn")?.addEventListener("click", setPrepared);

    onAuthStateChanged(auth, async (user) => {
      const isAdmin = user?.email?.toLowerCase() === "quaoratr@gmail.com";
      activeAdminEmail = isAdmin ? user.email : "";
      el("lockedState").classList.toggle("hidden", isAdmin);
      el("detailApp").classList.toggle("hidden", !isAdmin);
      if (!isAdmin) {
        el("detailStatus").textContent = user ? "Bu hesap admin değil." : "Giriş yapılmadı.";
        return;
      }

      await loadOrder().catch((error) => {
        console.error(error);
        el("detailStatus").textContent = "Sipariş yüklenemedi.";
      });
    });
  </script>
</body>
</html>
