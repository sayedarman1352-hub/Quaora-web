<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QUAORA ürün detayları">
    <title>Ürün Detayı | QUAORA</title>
    <link id="productCanonical" rel="canonical" href="https://www.quaora.com.tr/urun.html">
    <meta property="og:type" content="product">
    <meta property="og:site_name" content="QUAORA">
    <meta id="productOgTitle" property="og:title" content="QUAORA Ürün">
    <meta id="productOgDescription" property="og:description" content="QUAORA ürün detayları">
    <meta id="productOgUrl" property="og:url" content="https://www.quaora.com.tr/urun.html">
    <meta id="productOgImage" property="og:image" content="https://www.quaora.com.tr/image/seniseviom.jpeg">
    <script id="productStructuredData" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "QUAORA Ürün",
      "brand": {
        "@type": "Brand",
        "name": "QUAORA"
      }
    }

    <link rel="stylesheet" href="quaora-tailwind.css">
    <link rel="stylesheet" href="quaora-responsive.css?v=20260714-2">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="quaora-performance.js" defer></script>
    <script src="quaora-preorder.js" defer></script>
    <style>
        :root {
            --detail-ink: #111111;
            --detail-muted: #706d68;
            --detail-cream: #f4f1ea;
            --detail-line: rgba(17, 17, 17, .15);
        }

        [hidden] { display: none !important; }

        body.product-detail-page {
            min-height: 100vh;
            margin: 0;
            background: #fff !important;
            color: var(--detail-ink) !important;
        }

        .detail-header {
            position: sticky;
            top: 0;
            z-index: 50;
            min-height: 72px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            border-bottom: 1px solid var(--detail-line);
            background: rgba(255, 255, 255, .96);
            backdrop-filter: blur(14px);
        }

        .detail-back,
        .detail-cart-button {
            border: 0;
            background: transparent;
            color: var(--detail-ink);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .detail-back { justify-self: start; }
        .detail-cart-button { justify-self: end; padding: 12px 0; }

        .detail-brand {
            color: var(--detail-ink);
            font-family: var(--quaora-font-serif);
            font-size: 27px;
            font-weight: 600;
            letter-spacing: .18em;
            line-height: 1;
        }

        .detail-main {
            width: min(1440px, 100%);
            min-height: calc(100vh - 72px);
            margin: 0 auto;
        }

        .detail-state {
            min-height: 68vh;
            display: grid;
            place-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        .detail-loader-mark {
            width: 34px;
            height: 34px;
            margin: 0 auto 18px;
            border: 1px solid var(--detail-line);
            border-top-color: var(--detail-ink);
            border-radius: 50%;
            animation: detailSpin .8s linear infinite;
        }

        @keyframes detailSpin { to { transform: rotate(360deg); } }

        .detail-state p {
            margin: 0;
            color: var(--detail-muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        .detail-error h1 {
            margin: 0 0 14px;
            font-family: var(--quaora-font-serif);
            font-size: clamp(34px, 6vw, 64px);
            font-weight: 500;
        }

        .detail-error a {
            display: inline-block;
            margin-top: 24px;
            padding: 13px 18px;
            border: 1px solid var(--detail-ink);
            background: var(--detail-ink);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .13em;
            text-transform: uppercase;
        }

        .detail-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(390px, .75fr);
            align-items: start;
        }

        .detail-gallery {
            min-width: 0;
            padding: 28px;
            background: var(--detail-cream);
        }

        .detail-main-media {
            position: relative;
            min-height: 680px;
            aspect-ratio: 4 / 5;
            overflow: hidden;
            background: #e7e3dc;
        }

        .detail-main-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detail-no-image {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--detail-muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .18em;
        }

        .detail-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 2;
            padding: 8px 10px;
            background: #fff;
            color: var(--detail-ink);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .12em;
        }

        .detail-thumbnails {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .detail-thumbnail {
            aspect-ratio: 3 / 4;
            padding: 0;
            overflow: hidden;
            border: 1px solid transparent;
            background: #e7e3dc;
            cursor: pointer;
        }

        .detail-thumbnail.is-active { border-color: var(--detail-ink); }

        .detail-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detail-info-wrap {
            position: sticky;
            top: 72px;
            min-height: calc(100vh - 72px);
            padding: clamp(42px, 6vw, 92px) clamp(28px, 5vw, 72px);
            background: #fff;
        }

        .detail-kicker {
            margin: 0 0 18px;
            color: var(--detail-muted);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        .detail-title-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 18px;
            align-items: start;
        }

        .detail-title {
            margin: 0;
            font-size: clamp(34px, 4.2vw, 62px);
            font-weight: 400;
            letter-spacing: 0;
            line-height: 1.03;
        }

        .detail-favorite {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            padding: 0;
            border: 1px solid var(--detail-line);
            border-radius: 50%;
            background: #fff;
            color: var(--detail-ink);
            font-size: 25px;
            cursor: pointer;
        }

        .detail-price-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin: 25px 0 8px;
        }

        .detail-price {
            font-size: 20px;
            font-weight: 600;
        }

        .detail-old-price {
            color: var(--detail-muted);
            font-size: 13px;
            text-decoration: line-through;
        }

        .detail-stock {
            margin: 0;
            color: var(--detail-muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .detail-preorder-badge {
            display: inline-flex;
            width: fit-content;
            margin: 0 0 18px;
            padding: 8px 11px;
            border: 1px solid var(--detail-ink);
            background: var(--detail-ink);
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .15em;
        }

        .detail-preorder-notice {
            margin: 26px 0 0;
            padding: 18px;
            border: 1px solid var(--detail-ink);
            background: var(--detail-cream);
        }

        .detail-preorder-notice strong {
            display: block;
            margin-bottom: 6px;
            font-size: 11px;
            letter-spacing: .12em;
        }

        .detail-preorder-notice span {
            color: var(--detail-muted);
            font-size: 12px;
        }

        .detail-description {
            margin: 34px 0;
            padding: 24px 0;
            border-top: 1px solid var(--detail-line);
            border-bottom: 1px solid var(--detail-line);
        }

        .detail-label {
            display: block;
            margin: 0 0 13px;
            color: var(--detail-ink);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        .detail-description p {
            margin: 0;
            color: #55514c;
            font-size: 13px;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .detail-sizes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 26px;
        }

        .detail-size {
            min-width: 50px;
            height: 44px;
            padding: 0 13px;
            border: 1px solid var(--detail-line);
            border-radius: 0;
            background: #fff;
            color: var(--detail-ink);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .detail-size.is-selected {
            border-color: var(--detail-ink);
            background: var(--detail-ink);
            color: #fff;
        }

        .detail-size:disabled {
            color: #aaa;
            text-decoration: line-through;
            cursor: not-allowed;
        }

        .detail-buy-row {
            display: grid;
            grid-template-columns: 116px 1fr;
            gap: 10px;
        }

        .detail-quantity {
            height: 52px;
            display: grid;
            grid-template-columns: 36px 1fr 36px;
            align-items: center;
            border: 1px solid var(--detail-line);
        }

        .detail-quantity button {
            height: 100%;
            border: 0;
            background: transparent;
            font-size: 18px;
            cursor: pointer;
        }

        .detail-quantity span {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
        }

        .detail-add {
            min-height: 52px;
            border: 1px solid var(--detail-ink);
            border-radius: 0;
            background: var(--detail-ink);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .15em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .detail-add:disabled {
            border-color: #bbb;
            background: #bbb;
            cursor: not-allowed;
        }

        .detail-feedback {
            min-height: 20px;
            margin: 13px 0 0;
            color: var(--detail-muted);
            font-size: 10px;
            font-weight: 600;
        }

        .detail-footer {
            padding: 30px 20px;
            border-top: 1px solid var(--detail-line);
            background: var(--detail-cream);
            text-align: center;
            color: var(--detail-muted);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .2em;
        }

        .cart-overlay {
            position: fixed;
            inset: 0;
            z-index: 80;
            border: 0;
            background: rgba(17, 17, 17, .4);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease;
        }

        .cart-overlay.is-open {
            opacity: 1;
            pointer-events: auto;
        }

        .detail-cart-drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 90;
            width: min(430px, 100%);
            display: grid;
            grid-template-rows: auto 1fr auto;
            border-left: 1px solid var(--detail-line);
            background: #fff;
            transform: translateX(100%);
            transition: transform .28s ease;
        }

        .detail-cart-drawer.is-open { transform: translateX(0); }

        .cart-drawer-head,
        .cart-drawer-foot {
            padding: 22px;
            border-bottom: 1px solid var(--detail-line);
        }

        .cart-drawer-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cart-drawer-head h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 500;
        }

        .cart-drawer-head button {
            width: 38px;
            height: 38px;
            border: 0;
            background: transparent;
            font-size: 20px;
            cursor: pointer;
        }

        .cart-drawer-items {
            overflow-y: auto;
            padding: 18px 22px;
        }

        .cart-empty {
            margin: 70px 0;
            color: var(--detail-muted);
            font-size: 11px;
            text-align: center;
        }

        .cart-line {
            display: grid;
            grid-template-columns: 72px 1fr auto;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--detail-line);
        }

        .cart-line img {
            width: 72px;
            height: 92px;
            object-fit: cover;
            background: var(--detail-cream);
        }

        .cart-line h3 {
            margin: 0 0 6px;
            font-size: 11px;
            line-height: 1.45;
        }

        .cart-line p {
            margin: 3px 0;
            color: var(--detail-muted);
            font-size: 9px;
        }

        .cart-line-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 11px;
        }

        .cart-line-controls button,
        .cart-remove {
            border: 1px solid var(--detail-line);
            background: #fff;
            cursor: pointer;
        }

        .cart-line-controls button {
            width: 25px;
            height: 25px;
        }

        .cart-remove {
            align-self: start;
            padding: 5px 7px;
            font-size: 9px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-bottom: 18px;
            font-size: 13px;
            font-weight: 700;
        }

        .cart-checkout {
            width: 100%;
            min-height: 50px;
            border: 0;
            background: var(--detail-ink);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .15em;
            cursor: pointer;
        }

        @media (max-width: 820px) {
            .detail-header {
                min-height: 64px;
                padding: 0 14px;
            }

            .detail-brand { font-size: 21px; }
            .detail-back span { display: none; }
            .detail-cart-button { font-size: 9px; }

            .detail-layout { grid-template-columns: 1fr; }

            .detail-gallery { padding: 0; }

            .detail-main-media {
                min-height: auto;
                aspect-ratio: 3 / 4;
            }

            .detail-thumbnails {
                padding: 0 12px;
                overflow-x: auto;
                grid-template-columns: repeat(5, 72px);
            }

            .detail-info-wrap {
                position: static;
                min-height: auto;
                padding: 36px 20px 54px;
            }

            .detail-title { font-size: clamp(32px, 11vw, 48px); }
            .detail-buy-row { grid-template-columns: 104px 1fr; }
        }

        @media (max-width: 390px) {
            .detail-buy-row { grid-template-columns: 1fr; }
            .detail-quantity { width: 116px; }
        }
    </style>
</head>
<body class="product-detail-page">
    <button id="cartOverlay" class="cart-overlay" type="button" aria-label="Sepeti kapat"></button>

    <aside id="cartDrawer" class="detail-cart-drawer" aria-hidden="true" aria-label="Sepet">
        <div class="cart-drawer-head">
            <h2>Sepetim</h2>
            <button id="closeCartButton" type="button" aria-label="Sepeti kapat">&times;</button>
        </div>
        <div id="cartItems" class="cart-drawer-items"></div>
        <div class="cart-drawer-foot">
            <div class="cart-total"><span>Toplam</span><span id="cartTotal">₺0</span></div>
            <button id="checkoutButton" class="cart-checkout" type="button">Siparişi Tamamla</button>
        </div>
    </aside>

    <header class="detail-header">
        <a id="backLink" class="detail-back" href="index.html">&larr; <span>Koleksiyona dön</span></a>
        <a class="detail-brand" href="index.html">QUAORA</a>
        <button id="openCartButton" class="detail-cart-button" type="button">Sepet (<span id="cartCount">0</span>)</button>
    </header>

    <main class="detail-main">
        <section id="loadingState" class="detail-state" aria-live="polite">
            <div>
                <div class="detail-loader-mark"></div>
                <p>Ürün hazırlanıyor</p>
            </div>
        </section>

        <section id="errorState" class="detail-state detail-error" hidden>
            <div>
                <h1>Ürün bulunamadı</h1>
                <p id="errorMessage">Bu ürün kaldırılmış veya bağlantısı değişmiş olabilir.</p>
                <a id="errorBackLink" href="index.html">Ürünlere dön</a>
            </div>
        </section>

        <article id="productContent" class="detail-layout" hidden>
            <div class="detail-gallery">
                <div class="detail-main-media">
                    <span id="discountBadge" class="detail-badge" hidden></span>
                    <img id="mainProductImage" alt="" hidden>
                    <div id="noImageState" class="detail-no-image" hidden>GÖRSEL HAZIRLANIYOR</div>
                </div>
                <div id="thumbnailList" class="detail-thumbnails" hidden></div>
            </div>

            <div class="detail-info-wrap">
                <span id="preorderBadge" class="detail-preorder-badge" hidden>ÖNSİPARİŞ</span>
                <p id="categoryLabel" class="detail-kicker">QUAORA COLLECTION</p>
                <div class="detail-title-row">
                    <h1 id="productName" class="detail-title"></h1>
                    <button id="favoriteButton" class="detail-favorite" type="button" aria-label="Favoriye ekle" aria-pressed="false">&#9825;</button>
                </div>

                <div id="priceRow" class="detail-price-row">
                    <span id="salePrice" class="detail-price"></span>
                    <span id="originalPrice" class="detail-old-price" hidden></span>
                </div>
                <p id="stockText" class="detail-stock"></p>

                <div id="preorderNotice" class="detail-preorder-notice" hidden>
                    <strong>BU ÜRÜN ÖNSİPARİŞTEDİR</strong>
                    <span id="preorderDateText"></span>
                </div>

                <section class="detail-description">
                    <span class="detail-label">Ürün hakkında</span>
                    <p id="productDescription"></p>
                </section>

                <div id="purchasePanel">
                    <div id="sizeSection">
                        <span class="detail-label">Beden seç</span>
                        <div id="sizeList" class="detail-sizes"></div>
                    </div>

                    <div class="detail-buy-row">
                        <div class="detail-quantity" aria-label="Ürün adedi">
                            <button id="decreaseQuantity" type="button" aria-label="Adedi azalt">&minus;</button>
                            <span id="quantityValue">1</span>
                            <button id="increaseQuantity" type="button" aria-label="Adedi artır">+</button>
                        </div>
                        <button id="addToCartButton" class="detail-add" type="button">Sepete Ekle</button>
                    </div>
                    <p id="feedback" class="detail-feedback" aria-live="polite"></p>
                </div>
            </div>
        </article>
    </main>

    <footer class="detail-footer">© 2026 QUAORA SWIMWEAR</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChIV6BI3U6aPxUsRm0akBCPLLBAg6XM9U",
            authDomain: "quaora-web.firebaseapp.com",
            projectId: "quaora-web",
            storageBucket: "quaora-web.firebasestorage.app",
            messagingSenderId: "69244174750",
            appId: "1:69244174750:web:5c9e82172704bb39a2568f"
        };

        const CATALOG = {
            "ayakkabilar": { page: "ayakkabilar.html", label: "Ayakkabılar" },
            "bikini-altlari": { page: "bikini-altlari.html", label: "Bikini Altları" },
            "bikini_ustleri": { page: "bikini-ustleri.html", label: "Bikini Üstleri" },
            "bottom_products": { page: "bottom.html", label: "Bottoms" },
            "cantalar": { page: "cantalar.html", label: "Çantalar" },
            "conquette": { page: "coquette.html", label: "Coquette" },
            "gozlukler": { page: "gozlukler.html", label: "Gözlükler" },
            "mayokini_altlari": { page: "mayokini-altlari.html", label: "Mayokini Altları" },
            "mayokini_ustleri": { page: "mayokini-ustleri.html", label: "Mayokini Üstleri" },
            "mayolar": { page: "mayolar.html", label: "Mayolar" },
            "outlet_products": { page: "outlet.html", label: "Outlet" },
            "OUTLET": { page: "outlet.html", label: "Outlet" },
            "PANZER": { page: "panzer.html", label: "Panzer" },
            "pareolar": { page: "pareolar.html", label: "Pareolar" },
            "PIE": { page: "pie.html", label: "Pie" },
            "plaj_aksesuarlari": { page: "plaj-aksesuarlari.html", label: "Plaj Aksesuarları" },
            "RELOVE": { page: "relove.html", label: "Relove" },
            "sapkalar": { page: "sapkalar.html", label: "Şapkalar" },
            "takilar": { page: "takilar.html", label: "Takılar" },
            "tops_products": { page: "tops.html", label: "Tops" },
            "yeni_gelenler": { page: "yeni-gelenler.html", label: "Yeni Gelenler" }
        };

        const el = (id) => document.getElementById(id);
        const money = (value) => `₺${Number(value || 0).toLocaleString("tr-TR")}`;
        const escapeHtml = (value) => String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");

        const params = new URLSearchParams(window.location.search);
        const collectionName = params.get("collection") || "";
        const productId = params.get("id") || "";
        const catalogEntry = CATALOG[collectionName];
        const requestedFrom = params.get("from") || "";
        const validPages = new Set(Object.values(CATALOG).map((entry) => entry.page));
        const returnPage = validPages.has(requestedFrom) ? requestedFrom : (catalogEntry?.page || "index.html");

        let product = null;
        let selectedSize = "";
        let quantity = 1;
        let availableSizes = {};
        let cart = [];
        let favorites = [];

        try { cart = JSON.parse(localStorage.getItem("quaora_cart")) || []; } catch (error) { cart = []; }
        try { favorites = JSON.parse(localStorage.getItem("quaora_favorites")) || []; } catch (error) { favorites = []; }

        const setReturnLinks = () => {
            el("backLink").href = returnPage;
            el("errorBackLink").href = returnPage;
        };

        const showError = (message) => {
            el("loadingState").hidden = true;
            el("productContent").hidden = true;
            el("errorState").hidden = false;
            el("errorMessage").textContent = message;
        };

        const setMainImage = (source, index) => {
            const image = el("mainProductImage");
            image.src = source;
            image.hidden = false;
            el("noImageState").hidden = true;
            image.alt = `${product?.name || "QUAORA ürün"} - görsel ${index + 1}`;
            document.querySelectorAll(".detail-thumbnail").forEach((button, buttonIndex) => {
                button.classList.toggle("is-active", buttonIndex === index);
            });
        };

        const renderImages = () => {
            const images = Array.isArray(product.images) ? product.images.filter(Boolean) : [];
            if (!images.length) {
                el("mainProductImage").hidden = true;
                el("noImageState").hidden = false;
                el("thumbnailList").hidden = true;
                return;
            }

            const list = el("thumbnailList");
            list.innerHTML = "";
            images.forEach((source, index) => {
                const button = document.createElement("button");
                const image = document.createElement("img");
                button.type = "button";
                button.className = "detail-thumbnail";
                button.setAttribute("aria-label", `${index + 1}. görseli göster`);
                image.src = source;
                image.alt = "";
                button.appendChild(image);
                button.addEventListener("click", () => setMainImage(source, index));
                list.appendChild(button);
            });
            list.hidden = images.length < 2;
            setMainImage(images[0], 0);
        };

        const getTotalStock = () => Object.values(availableSizes).reduce((sum, stock) => sum + Number(stock || 0), 0);

        const absoluteUrl = (value) => {
            try { return new URL(value, "https://www.quaora.com.tr/").href; }
            catch (error) { return ""; }
        };

        const updateProductStructuredData = (salePrice, totalStock) => {
            const canonicalParams = new URLSearchParams({ collection: collectionName, id: productId });
            const canonicalUrl = `https://www.quaora.com.tr/urun.html?${canonicalParams.toString()}`;
            const productName = product.name || "QUAORA Ürün";
            const description = product.description || `${productName}, QUAORA ${catalogEntry.label} koleksiyonunda.`;
            const images = (Array.isArray(product.images) ? product.images : [])
                .map(absoluteUrl)
                .filter(Boolean);

            el("productCanonical").href = canonicalUrl;
            document.querySelector('meta[name="description"]')?.setAttribute("content", description.slice(0, 300));
            el("productOgTitle").content = `${productName} | QUAORA`;
            el("productOgDescription").content = description.slice(0, 300);
            el("productOgUrl").content = canonicalUrl;
            if (images[0]) el("productOgImage").content = images[0];

            const schema = {
                "@context": "https://schema.org",
                "@type": "Product",
                "@id": `${canonicalUrl}#product`,
                "url": canonicalUrl,
                "name": productName,
                "description": description,
                "sku": product.sku || productId,
                "category": catalogEntry.label,
                "brand": {
                    "@type": "Brand",
                    "name": "QUAORA"
                }
            };

            if (images.length) schema.image = images;
            if (product.material) schema.material = product.material;
            if (product.color) schema.color = product.color;
            if (salePrice > 0) {
                const preorder = window.QuaoraPreorder.isPreorder(product);
                schema.offers = {
                    "@type": "Offer",
                    "url": canonicalUrl,
                    "priceCurrency": "TRY",
                    "price": salePrice,
                    "itemCondition": "https://schema.org/NewCondition",
                    "availability": preorder
                        ? "https://schema.org/PreOrder"
                        : (totalStock > 0 ? "https://schema.org/InStock" : "https://schema.org/OutOfStock"),
                    "seller": {
                        "@type": "OnlineStore",
                        "@id": "https://www.quaora.com.tr/#store",
                        "name": "QUAORA",
                        "url": "https://www.quaora.com.tr/"
                    }
                };
            }

            el("productStructuredData").textContent = JSON.stringify(schema);
        };

        const renderSizes = () => {
            const rawSizes = product.sizeStocks && typeof product.sizeStocks === "object" ? product.sizeStocks : {};
            availableSizes = { ...rawSizes };
            if (!Object.keys(availableSizes).length && Number(product.stock) > 0) {
                availableSizes.Standart = Number(product.stock);
            }

            const list = el("sizeList");
            list.innerHTML = "";
            Object.entries(availableSizes).forEach(([size, stock]) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "detail-size";
                button.textContent = size;
                button.disabled = Number(stock || 0) <= 0;
                button.addEventListener("click", () => {
                    selectedSize = size;
                    quantity = 1;
                    el("quantityValue").textContent = quantity;
                    document.querySelectorAll(".detail-size").forEach((sizeButton) => {
                        sizeButton.classList.toggle("is-selected", sizeButton === button);
                    });
                    el("feedback").textContent = "";
                });
                list.appendChild(button);
            });

            el("sizeSection").hidden = !Object.keys(availableSizes).length;
        };

        const updateFavoriteButton = () => {
            const isFavorite = favorites.includes(productId);
            el("favoriteButton").innerHTML = isFavorite ? "&#9829;" : "&#9825;";
            el("favoriteButton").setAttribute("aria-pressed", String(isFavorite));
            el("favoriteButton").setAttribute("aria-label", isFavorite ? "Favorilerden çıkar" : "Favoriye ekle");
        };

        const renderProduct = () => {
            const salePrice = Number(product.salePrice || product.price || 0);
            const originalPrice = Number(product.originalPrice || 0);
            const discount = Number(product.discount || (originalPrice > salePrice && salePrice > 0
                ? Math.round(((originalPrice - salePrice) / originalPrice) * 100)
                : 0));
            const preorder = window.QuaoraPreorder.isPreorder(product);
            const preorderDate = window.QuaoraPreorder.formatDate(product.preorderEstimatedDate || product.estimatedDate);

            document.title = `${product.name || "Ürün"} | QUAORA`;
            el("categoryLabel").textContent = `QUAORA / ${catalogEntry.label}`;
            el("productName").textContent = product.name || "QUAORA Ürün";
            el("productDescription").textContent = window.QuaoraPreorder.descriptionText(product);
            el("preorderBadge").hidden = !preorder;
            el("preorderNotice").hidden = !preorder;
            el("preorderDateText").textContent = preorder ? `Tahmini teslim tarihi: ${preorderDate}` : "";
            el("salePrice").textContent = money(salePrice);
            el("priceRow").hidden = salePrice <= 0;
            el("originalPrice").hidden = !(originalPrice > salePrice && salePrice > 0);
            el("originalPrice").textContent = money(originalPrice);
            el("discountBadge").hidden = discount <= 0;
            el("discountBadge").textContent = discount > 0 ? `%${discount} İNDİRİM` : "";

            renderImages();
            renderSizes();
            updateFavoriteButton();

            const totalStock = getTotalStock();
            updateProductStructuredData(salePrice, totalStock);
            if (salePrice <= 0) {
                el("stockText").textContent = "Vitrin ürünü";
                el("purchasePanel").hidden = true;
            } else if (totalStock <= 0) {
                el("stockText").textContent = "Tükendi";
                el("addToCartButton").disabled = true;
                el("addToCartButton").textContent = "Tükendi";
            } else {
                el("stockText").textContent = preorder
                    ? `Önsiparişe açık · Tahmini ${preorderDate}`
                    : (totalStock < 5 ? `Son ${totalStock} adet` : "Stokta");
                el("addToCartButton").textContent = preorder ? "Önsipariş Ver" : "Sepete Ekle";
            }

            el("loadingState").hidden = true;
            el("errorState").hidden = true;
            el("productContent").hidden = false;
        };

        const saveCart = () => {
            localStorage.setItem("quaora_cart", JSON.stringify(cart));
            renderCart();
        };

        const renderCart = () => {
            const container = el("cartItems");
            const count = cart.reduce((sum, item) => sum + Number(item.qty || 1), 0);
            const total = cart.reduce((sum, item) => sum + (Number(item.price || 0) * Number(item.qty || 1)), 0);
            el("cartCount").textContent = count;
            el("cartTotal").textContent = money(total);

            if (!cart.length) {
                container.innerHTML = '<p class="cart-empty">Sepetiniz şu an boş.</p>';
                return;
            }

            container.innerHTML = cart.map((item, index) => `
                <div class="cart-line">
                    ${item.image ? `<img src="${escapeHtml(item.image)}" alt="">` : '<div></div>'}
                    <div>
                        <h3>${escapeHtml(item.name || "Ürün")}</h3>
                        <p>Beden: ${escapeHtml(item.size || "-")}</p>
                        ${item.isPreorder ? `<p>Önsipariş · Tahmini ${escapeHtml(window.QuaoraPreorder.formatDate(item.preorderEstimatedDate))}</p>` : ""}
                        <p>${money(Number(item.price || 0) * Number(item.qty || 1))}</p>
                        <div class="cart-line-controls">
                            <button type="button" data-cart-action="decrease" data-cart-index="${index}" aria-label="Adedi azalt">&minus;</button>
                            <span>${Number(item.qty || 1)}</span>
                            <button type="button" data-cart-action="increase" data-cart-index="${index}" aria-label="Adedi artır">+</button>
                        </div>
                    </div>
                    <button class="cart-remove" type="button" data-cart-action="remove" data-cart-index="${index}" aria-label="Ürünü kaldır">Sil</button>
                </div>
            `).join("");
        };

        const toggleCart = (open) => {
            el("cartDrawer").classList.toggle("is-open", open);
            el("cartOverlay").classList.toggle("is-open", open);
            el("cartDrawer").setAttribute("aria-hidden", String(!open));
            document.body.style.overflow = open ? "hidden" : "";
        };

        const addToCart = () => {
            const salePrice = Number(product.salePrice || product.price || 0);
            const sizeNames = Object.keys(availableSizes);
            if (sizeNames.length && !selectedSize) {
                el("feedback").textContent = "Önce beden seçmelisiniz.";
                return;
            }

            const size = selectedSize || "Standart";
            const stock = Number(availableSizes[size] || product.stock || 0);
            if (stock <= 0) {
                el("feedback").textContent = "Bu ürün şu an stokta bulunmuyor.";
                return;
            }

            const cartItemId = `${collectionName}_${productId}_${size}`;
            const existing = cart.find((item) => item.cartItemId === cartItemId);
            const nextQuantity = Number(existing?.qty || 0) + quantity;
            if (nextQuantity > stock) {
                el("feedback").textContent = `Bu beden için en fazla ${stock} adet seçebilirsiniz.`;
                return;
            }

            if (existing) {
                existing.qty = nextQuantity;
            } else {
                cart.push({
                    cartItemId,
                    id: productId,
                    name: product.name || "QUAORA Ürün",
                    price: salePrice,
                    size,
                    qty: quantity,
                    collectionName,
                    stock,
                    paymentLink: product.paymentLink || product.paymentUrl || product.payLink || "",
                    image: Array.isArray(product.images) && product.images[0] ? product.images[0] : "",
                    isPreorder: window.QuaoraPreorder.isPreorder(product),
                    preorderEstimatedDate: product.preorderEstimatedDate || ""
                });
            }

            saveCart();
            el("feedback").textContent = `${quantity} adet sepete eklendi.`;
            toggleCart(true);
        };

        el("favoriteButton").addEventListener("click", () => {
            favorites = favorites.includes(productId)
                ? favorites.filter((id) => id !== productId)
                : [...favorites, productId];
            localStorage.setItem("quaora_favorites", JSON.stringify(favorites));
            updateFavoriteButton();
        });

        el("decreaseQuantity").addEventListener("click", () => {
            quantity = Math.max(1, quantity - 1);
            el("quantityValue").textContent = quantity;
        });

        el("increaseQuantity").addEventListener("click", () => {
            const stock = Number(availableSizes[selectedSize] || product?.stock || 1);
            quantity = Math.min(stock, quantity + 1);
            el("quantityValue").textContent = quantity;
        });

        el("addToCartButton").addEventListener("click", addToCart);
        el("openCartButton").addEventListener("click", () => toggleCart(true));
        el("closeCartButton").addEventListener("click", () => toggleCart(false));
        el("cartOverlay").addEventListener("click", () => toggleCart(false));
        el("checkoutButton").addEventListener("click", () => {
            if (!cart.length) return;
            window.location.href = "checkout.html";
        });

        el("cartItems").addEventListener("click", (event) => {
            const button = event.target.closest("[data-cart-action]");
            if (!button) return;
            const index = Number(button.dataset.cartIndex);
            const item = cart[index];
            if (!item) return;
            if (button.dataset.cartAction === "remove") cart.splice(index, 1);
            if (button.dataset.cartAction === "decrease") item.qty = Math.max(1, Number(item.qty || 1) - 1);
            if (button.dataset.cartAction === "increase") {
                const itemStock = Number(item.stock || 0);
                item.qty = itemStock > 0
                    ? Math.min(itemStock, Number(item.qty || 1) + 1)
                    : Number(item.qty || 1) + 1;
            }
            saveCart();
        });

        setReturnLinks();
        renderCart();

        if (!catalogEntry || !productId) {
            showError("Ürün bağlantısı eksik veya geçersiz.");
        } else {
            try {
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const snapshot = await getDoc(doc(db, collectionName, productId));
                if (!snapshot.exists()) {
                    showError("Bu ürün kaldırılmış veya bağlantısı değişmiş olabilir.");
                } else {
                    product = { id: snapshot.id, ...snapshot.data() };
                    renderProduct();
                }
            } catch (error) {
                console.error("Ürün yüklenemedi:", error);
                showError("Ürün bilgileri şu anda yüklenemedi. Lütfen tekrar deneyin.");
            }
        }
    </script>
</body>
</html>
